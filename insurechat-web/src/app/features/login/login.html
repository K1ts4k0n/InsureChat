<main class="login-wrap">
  <theme-toggle />

  <section class="login-card" aria-labelledby="login-title">
    <header class="lc-head">
      <p class="wordmark">InsureChat</p>
      <h1 id="login-title">เข้าสู่ระบบผู้ดูแล</h1>
      <p class="sub">สำหรับเจ้าหน้าที่ที่ได้รับสิทธิ์เท่านั้น</p>
    </header>

    <form class="lc-form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field-label">ชื่อผู้ใช้</span>
        <input type="text" name="username" [(ngModel)]="username" autocomplete="username"
               autocapitalize="none" spellcheck="false" required />
      </label>

      <label class="field">
        <span class="field-label">รหัสผ่าน</span>
        <input type="password" name="password" [(ngModel)]="password"
               autocomplete="current-password" required />
      </label>

      @if (error()) {
        <p class="error" role="alert">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="7.5" />
            <path d="M10 6.5v4M10 13.6v.01" />
          </svg>
          <span>{{ error() }}</span>
        </p>
      }

      <button type="submit" class="submit" [disabled]="loading()">
        {{ loading() ? 'กำลังเข้าสู่ระบบ…' : 'เข้าสู่ระบบ' }}
      </button>
    </form>

    <footer class="lc-foot">
      <a class="back" href="/quote">
        <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M12 5l-5 5 5 5" />
        </svg>
        <span>กลับหน้าลูกค้า</span>
      </a>
    </footer>
  </section>
</main>
